name: Offline validation kit
on:
  workflow_dispatch:
  push:
    branches: [feature/integrated-art-v2]
    paths: [.github/workflows/offline-dev-kit.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracked source and pinned official tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit
          git archive --format=zip HEAD -o kit/source.zip
          printf '%s\n' "$GITHUB_SHA" > kit/SOURCE-REVISION.txt
          curl -fL --retry 3 -o kit/godot-linux.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  kit/godot-linux.zip' | sha256sum -c -
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz' | sha256sum -c -
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('templates.tpz') as src, zipfile.ZipFile('kit/windows-templates.tpz','w',zipfile.ZIP_DEFLATED) as dst:
              for name in ['version.txt','windows_release_x86_64.exe','windows_debug_x86_64.exe']:
                  path='templates/'+name
                  dst.writestr(path,src.read(path))
          PY
          curl -fL --retry 3 -o kit/GODOT-LICENSE.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt
          curl -fL --retry 3 -o kit/GODOT-COPYRIGHT.txt https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/COPYRIGHT.txt
          (cd kit && sha256sum source.zip godot-linux.zip windows-templates.tpz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectE-offline-validation-kit
          path: kit/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
