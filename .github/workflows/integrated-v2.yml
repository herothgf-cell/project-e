name: Integrated V2
on:
  pull_request:
  push:
    branches: [main, feature/integrated-art-v2]
permissions:
  contents: read
concurrency:
  group: integrated-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Recoverable exact source snapshot
        run: |
          mkdir -p snapshot
          git archive --format=zip HEAD -o snapshot/source.zip
          git rev-parse HEAD > snapshot/SOURCE-REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectE-V2-source
          path: snapshot/
          retention-days: 7
          if-no-files-found: error
      - name: Pinned official engine
        run: |
          mkdir -p .ci
          curl -fL --retry 3 -o .ci/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .ci/godot.zip' | sha256sum -c -
          unzip -q .ci/godot.zip -d .ci
          chmod +x .ci/Godot_v4.7.2-stable_linux.x86_64
      - name: Full behavioral regression
        run: python tools/check_godot.py --godot "$PWD/.ci/Godot_v4.7.2-stable_linux.x86_64"
      - name: Capture all twelve skills and terrain in the real renderer
        run: |
          mkdir -p review
          python - <<'PY'
          import os
          from tools.check_godot import run
          run(['xvfb-run','-a',os.path.abspath('.ci/Godot_v4.7.2-stable_linux.x86_64'),'--path','game/project-e','--rendering-method','gl_compatibility','--audio-driver','Dummy','--script','tests/capture_integrated_v2.gd','--','--output='+os.path.abspath('review')], r'INTEGRATED_CAPTURE_OK:', timeout=300)
          PY
          printf 'source=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > review/CAPTURE-SOURCE.txt
      - name: Capture V5 illustrated heroes and canal battlefield
        run: |
          python - <<'PY'
          import os
          from tools.check_godot import run
          run(['xvfb-run','-a',os.path.abspath('.ci/Godot_v4.7.2-stable_linux.x86_64'),'--path','game/project-e','--rendering-method','gl_compatibility','--audio-driver','Dummy','--script',os.path.abspath('tools/art/capture_illustrated_pass.gd'),'--','--output='+os.path.abspath('review/v5')], r'CAPTURE_ART_OK', timeout=300)
          PY
      - name: Capture V7 skills, items, shop and player interface
        run: |
          python - <<'PY'
          import os
          from tools.check_godot import run
          run(['xvfb-run', '-a', os.path.abspath('.ci/Godot_v4.7.2-stable_linux.x86_64'),
               '--path', 'game/project-e', '--rendering-method', 'gl_compatibility',
               '--audio-driver', 'Dummy', '--script', os.path.abspath('tools/art/capture_player_view.gd'),
               '--', '--output=' + os.path.abspath('review/v7')], r'PLAYER_REVIEW_OK', timeout=180)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectE-V2-review
          path: review/
          retention-days: 14
          if-no-files-found: error
