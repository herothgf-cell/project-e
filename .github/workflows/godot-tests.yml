name: Godot regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci
          curl -fL --retry 3             -o .ci/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q .ci/godot.zip -d .ci
          chmod +x .ci/Godot_v4.7.2-stable_linux.x86_64
          .ci/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Run Project E behavioral suites
        shell: bash
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          python tools/check_godot.py --godot "$PWD/.ci/Godot_v4.7.2-stable_linux.x86_64"
